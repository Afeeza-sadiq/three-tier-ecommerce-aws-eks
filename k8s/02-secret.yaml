# DO NOT commit real values to git. Generate with:
#   kubectl create secret generic backend-secret \
#     --namespace ecommerce \
#     --from-literal=DB_USER=admin \
#     --from-literal=DB_PASSWORD='<your-db-password>' \
#     --dry-run=client -o yaml > k8s/02-secret.yaml
#
# Or better: use AWS Secrets Manager + the External Secrets Operator instead
# of committing a Secret manifest at all.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: ecommerce
type: Opaque
stringData:
  DB_USER: "admin"
  DB_PASSWORD: "REPLACE_ME"
